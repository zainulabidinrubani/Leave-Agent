<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leave Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #ece7d8;
    --paper-line: #cdc6ab;
    --ink-navy: #1f2e4d;
    --ink-navy-soft: #3a4d75;
    --stamp-gold: #a97c1f;
    --stamp-green: #3f6b4a;
    --stamp-red: #9c3b34;
    --text-primary: #262115;
    --text-muted: #6f6851;
    --focus-ring: #1f2e4d;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        var(--paper-line) 32px
      ),
      var(--paper);
    color: var(--text-primary);
    font-family: "IBM Plex Sans", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .desk {
    width: 100%;
    max-width: 640px;
    background: #f6f3e8;
    border: 1px solid var(--paper-line);
    box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 12px 32px rgba(38,33,21,0.10);
    display: flex;
    flex-direction: column;
    height: min(760px, 88vh);
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--paper-line);
  }

  .stamp {
    flex: none;
    width: 46px;
    height: 46px;
    border: 2px solid var(--stamp-gold);
    border-radius: 50%;
    color: var(--stamp-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    transform: rotate(-8deg);
  }

  .heading h1 {
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    line-height: 1.2;
  }

  .heading p {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .reset-link {
    margin-left: auto;
    font-size: 13px;
    color: var(--ink-navy-soft);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    white-space: nowrap;
  }
  .reset-link:hover,
  .reset-link:focus-visible {
    border-bottom-color: var(--ink-navy-soft);
  }

  .transcript {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
  }

  .entry {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 12px;
    padding: 10px 0 18px;
    border-left: 2px solid transparent;
  }

  .entry .time {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding-top: 3px;
  }

  .entry .bubble .who {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .entry.user { border-left-color: var(--ink-navy); padding-left: 10px; margin-left: -12px; }
  .entry.assistant { border-left-color: var(--stamp-gold); padding-left: 10px; margin-left: -12px; }
  .entry.error .bubble .who { color: var(--stamp-red); }
  .entry.error .bubble p { color: var(--stamp-red); }

  .bubble p {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding-top: 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--stamp-gold);
    animation: blot 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blot {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing span { animation: none; opacity: 0.7; }
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--paper-line);
  }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    border-bottom: 1px solid var(--paper-line);
    background: transparent;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 15px;
    color: var(--text-primary);
    padding: 8px 2px;
    line-height: 1.4;
    max-height: 120px;
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea:focus {
    outline: none;
    border-bottom: 1px solid var(--ink-navy);
  }
  textarea:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  button[type="submit"] {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--ink-navy);
    color: #f6f3e8;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  button[type="submit"]:hover { background: var(--ink-navy-soft); }
  button[type="submit"]:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  button[type="submit"]:disabled {
    background: var(--paper-line);
    cursor: default;
  }

  .transcript::-webkit-scrollbar { width: 8px; }
  .transcript::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 4px; }

  @media (max-width: 480px) {
    body { padding: 0; }
    .desk { height: 100vh; max-width: 100%; border: none; }
    header, form, .transcript { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<main class="desk">
  <header>
    <div class="stamp">HR</div>
    <div class="heading">
      <h1>Leave Desk</h1>
      <p>Ask about balances, submit requests, check status</p>
    </div>
    <a href="#" class="reset-link" id="resetLink">start new conversation</a>
  </header>

  <div class="transcript" id="transcript" aria-live="polite"></div>

  <form id="chatForm">
    <textarea
      id="messageInput"
      rows="1"
      placeholder="Type here — e.g. my id is E004, I want 2 days leave"
      required
    ></textarea>
    <button type="submit" id="sendButton" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
  </form>
</main>

<script>
  // -----------------------------------------------------------------------
  // Point this at your deployed FastAPI backend before going live.
  // Optionally override at runtime with ?api=https://your-api.example.com
  // -----------------------------------------------------------------------
  const DEFAULT_API_URL = "https://leave-agent-5if8.onrender.com";
  const params = new URLSearchParams(window.location.search);
  const API_URL = params.get("api") || DEFAULT_API_URL;

  const transcript = document.getElementById("transcript");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const resetLink = document.getElementById("resetLink");

  const STORAGE_KEY = "leave_desk_session_id";
  let sessionId = localStorage.getItem(STORAGE_KEY) || null;

  function timestamp() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function addEntry(who, text, kind) {
    const entry = document.createElement("div");
    entry.className = `entry ${kind}`;
    entry.innerHTML = `
      <div class="time">${timestamp()}</div>
      <div class="bubble">
        <div class="who">${who}</div>
        <p></p>
      </div>
    `;
    entry.querySelector("p").textContent = text;
    transcript.appendChild(entry);
    transcript.scrollTop = transcript.scrollHeight;
    return entry;
  }

  function addTyping() {
    const entry = document.createElement("div");
    entry.className = "entry assistant";
    entry.innerHTML = `
      <div class="time">${timestamp()}</div>
      <div class="bubble">
        <div class="who">leave desk</div>
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    `;
    transcript.appendChild(entry);
    transcript.scrollTop = transcript.scrollHeight;
    return entry;
  }

  function greet() {
    addEntry(
      "leave desk",
      "Tell me your employee ID or name to get started — I can check your balance, submit leave, or check a request's status.",
      "assistant"
    );
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addEntry("you", message, "user");
    input.value = "";
    input.style.height = "auto";
    sendButton.disabled = true;
    const typingEntry = addTyping();

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, session_id: sessionId }),
      });

      if (!res.ok) throw new Error(`Server responded with ${res.status}`);

      const data = await res.json();
      sessionId = data.session_id;
      localStorage.setItem(STORAGE_KEY, sessionId);

      typingEntry.remove();
      addEntry("leave desk", data.reply, "assistant");
    } catch (err) {
      typingEntry.remove();
      addEntry(
        "leave desk",
        "Couldn't reach the leave desk. Check that the API is running and reachable, then try again.",
        "assistant error"
      );
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  resetLink.addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem(STORAGE_KEY);
    sessionId = null;
    transcript.innerHTML = "";
    greet();
  });

  greet();
</script>
</body>
</html>
